name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# GITHUB_TOKEN needs write access to create releases & upload artifacts.
permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Require release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 is not set. Refusing to publish a"
            echo "::error::debug-signed APK: every run would use a different"
            echo "::error::throwaway key and users could not update in place."
            exit 1
          fi

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          mkdir -p android/keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/keystore/molido-release.p12
          {
            echo "storeFile=../keystore/molido-release.p12"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=molido"
            echo "keyPassword=$KEYSTORE_PASSWORD"
          } > android/key.properties

      - name: Analyze & Test (gate)
        run: |
          flutter analyze --fatal-infos
          flutter test

      - name: Build APK (release, signed with the release key)
        run: flutter build apk --release

      - name: Verify APK signature
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          APK=build/app/outputs/flutter-apk/app-release.apk
          "$APKSIGNER" verify --print-certs --verbose "$APK"

      - name: Rename artifact
        run: mv build/app/outputs/flutter-apk/app-release.apk molido-market-${{ github.ref_name }}.apk

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: molido-market-*.apk
          generate_release_notes: true
