name: Release APK

on:
  push:
    tags:
      - 'v*'
  # Manual runs are DRY RUNS: the full signed build and checks, with the
  # APK kept as a short-lived workflow artifact (even when started from a
  # tag ref). Only a pushed v* tag creates or updates a GitHub release.
  workflow_dispatch:

# GITHUB_TOKEN needs write access to create releases & upload artifacts.
permissions:
  contents: write

jobs:
  build-release:
    # Pinned: ubuntu-latest moves to 26.04 from 2026-10-19. 24.04 is the
    # image every release so far was built and signed on; move deliberately
    # after a green run on ubuntu-26.04 (Flutter CI → Run workflow).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Require release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 is not set. Refusing to publish a"
            echo "::error::debug-signed APK: every run would use a different"
            echo "::error::throwaway key and users could not update in place."
            exit 1
          fi

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          mkdir -p android/keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/keystore/molido-release.p12
          {
            echo "storeFile=../keystore/molido-release.p12"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=molido"
            echo "keyPassword=$KEYSTORE_PASSWORD"
          } > android/key.properties

      - name: Analyze & Test (gate)
        run: |
          flutter analyze --fatal-infos
          flutter test

      - name: Build APK (release, signed with the release key)
        run: flutter build apk --release

      - name: Verify APK signature
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          APK=build/app/outputs/flutter-apk/app-release.apk
          "$APKSIGNER" verify --print-certs --verbose "$APK"

      - name: Rename artifact
        env:
          NAME: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('dryrun-{0}', github.sha) }}
        run: mv build/app/outputs/flutter-apk/app-release.apk "molido-market-$NAME.apk"

      - name: Keep dry-run APK as a workflow artifact
        if: ${{ !(github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) }}
        uses: actions/upload-artifact@v7
        with:
          name: release-apk-dryrun
          path: molido-market-*.apk
          retention-days: 3

      - name: Upload to release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: molido-market-*.apk
          generate_release_notes: true
