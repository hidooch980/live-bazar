name: Price Health & Static Snapshot

# NOT a real-time backend (MASTER PROMPT §35).
# Periodically verifies that keyless public providers are healthy and
# refreshes the static fallback snapshot data/latest.json.

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: CoinGecko health
        id: coingecko
        run: |
          code=$(curl -s -o /tmp/cg.json -w '%{http_code}' \
            "https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum,tether&vs_currencies=usd&include_24hr_change=true")
          echo "status=$code" >> "$GITHUB_OUTPUT"
          test "$code" = "200"

      - name: ExchangeRate-API health
        id: erapi
        run: |
          code=$(curl -s -o /tmp/fx.json -w '%{http_code}' \
            "https://open.er-api.com/v6/latest/USD")
          echo "status=$code" >> "$GITHUB_OUTPUT"
          test "$code" = "200"

      # Non-fatal: a TGJU outage must not block the crypto/FX snapshot.
      # The bucketed cache-buster mirrors the app (see IranianMarketProvider).
      - name: TGJU Iranian market health
        id: tgju
        continue-on-error: true
        run: |
          code=$(curl -s -o /tmp/ir.json -w '%{http_code}'             "https://call1.tgju.org/ajax.json?v=$(( $(date +%s) / 10 ))")
          echo "status=$code" >> "$GITHUB_OUTPUT"
          test "$code" = "200"

      - name: Build static snapshot (fallback only)
        if: success()
        run: |
          python3 - <<'PY'
          import json, datetime, pathlib

          cg = json.load(open('/tmp/cg.json'))
          fx = json.load(open('/tmp/fx.json'))
          now = datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')
          quotes = {}

          coin_map = {'bitcoin':'btc_usd','ethereum':'eth_usd','tether':'usdt_usd'}
          names = {'btc_usd':('BTC/USD','Bitcoin','بیت‌کوین'),
                   'eth_usd':('ETH/USD','Ethereum','اتریوم'),
                   'usdt_usd':('USDT/USD','Tether','تتر')}
          for k, aid in coin_map.items():
              if k in cg and 'usd' in cg[k]:
                  s, n, nf = names[aid]
                  quotes[aid] = {
                      'id': aid, 'symbol': s, 'name': n, 'nameFa': nf,
                      'category': 'crypto',
                      'price': cg[k]['usd'],
                      'changePercent': cg[k].get('usd_24h_change', 0),
                      'unit': '', 'currency': 'USD',
                      'timestamp': now, 'source': 'CoinGecko',
                      'status': 'LIVE', 'confidence': 1.0,
                  }

          rates = fx.get('rates', {})
          ts = datetime.datetime.fromtimestamp(
              fx.get('time_last_update_unix', 0), datetime.timezone.utc
          ).strftime('%Y-%m-%dT%H:%M:%SZ') if fx.get('time_last_update_unix') else now
          for code in ['EUR','GBP','AED','TRY','CNY','CAD','AUD','CHF','JPY']:
              if code in rates and rates[code]:
                  aid = f'fx_{code.lower()}'
                  quotes[aid] = {
                      'id': aid, 'symbol': code,
                      'category': 'currency',
                      'price': round(1.0 / rates[code], 8),
                      'unit': '', 'currency': code,
                      'timestamp': ts, 'source': 'ExchangeRate-API',
                      'status': 'LIVE', 'confidence': 1.0,
                  }

          # ---- Iranian free market / gold / coins (TGJU, Rial -> Toman) ----
          # (id, symbol, name, nameFa, category, unit, currency)
          ir_map = {
            'price_dollar_rl': ('ir_usd','USD/IRR-FM','US Dollar (Free Market)','دلار آمریکا (بازار آزاد)','iranianCurrency','تومان','IRR'),
            'price_eur': ('ir_eur','EUR/IRR-FM','Euro (Free Market)','یورو (بازار آزاد)','iranianCurrency','تومان','IRR'),
            'price_aed': ('ir_aed','AED/IRR-FM','UAE Dirham (Free Market)','درهم امارات (بازار آزاد)','iranianCurrency','تومان','IRR'),
            'price_gbp': ('ir_gbp','GBP/IRR-FM','British Pound (Free Market)','پوند انگلیس (بازار آزاد)','iranianCurrency','تومان','IRR'),
            'price_try': ('ir_try','TRY/IRR-FM','Turkish Lira (Free Market)','لیر ترکیه (بازار آزاد)','iranianCurrency','تومان','IRR'),
            'price_cny': ('ir_cny','CNY/IRR-FM','Chinese Yuan (Free Market)','یوان چین (بازار آزاد)','iranianCurrency','تومان','IRR'),
            'geram18': ('gold_18k','GOLD-18K','Gold 18K','طلای ۱۸ عیار','gold','گرم','IRR'),
            'geram24': ('gold_24k','GOLD-24K','Gold 24K','طلای ۲۴ عیار','gold','گرم','IRR'),
            'mesghal': ('mesghal','MESGHAL','Mesghal Gold','مثقال طلا','gold','مثقال','IRR'),
            'ons': ('xau_usd','XAU/USD','Gold Ounce / USD','انس جهانی طلا','gold','اونس','USD'),
            'silver': ('silver','XAG/USD','Silver Ounce / USD','انس جهانی نقره','gold','اونس','USD'),
            'sekee': ('coin_emami','COIN-EMAMI','Emami Coin','سکه امامی','coin','عدد','IRR'),
            'sekeb': ('coin_bahar','COIN-BAHAR','Bahare Azadi Coin','سکه بهاره آزادی','coin','عدد','IRR'),
            'nim': ('coin_half','COIN-HALF','Half Coin','نیم سکه','coin','عدد','IRR'),
            'rob': ('coin_quarter','COIN-QUARTER','Quarter Coin','ربع سکه','coin','عدد','IRR'),
            'gerami': ('coin_gram','COIN-GRAM','Gram Gold Coin','سکه گرمی','coin','عدد','IRR'),
            'price_cad': ('ir_cad','CAD/IRR-FM','Canadian Dollar (Free Market)','دلار کانادا (بازار آزاد)','iranianCurrency','تومان','IRR'),
            'price_aud': ('ir_aud','AUD/IRR-FM','Australian Dollar (Free Market)','دلار استرالیا (بازار آزاد)','iranianCurrency','تومان','IRR'),
            'price_chf': ('ir_chf','CHF/IRR-FM','Swiss Franc (Free Market)','فرانک سوئیس (بازار آزاد)','iranianCurrency','تومان','IRR'),
            'price_jpy': ('ir_jpy','JPY100/IRR-FM','Japanese Yen per 100 (Free Market)','ین ژاپن، هر ۱۰۰ ین (بازار آزاد)','iranianCurrency','تومان','IRR'),
            'price_rub': ('ir_rub','RUB/IRR-FM','Russian Ruble (Free Market)','روبل روسیه (بازار آزاد)','iranianCurrency','تومان','IRR'),
            'price_iqd': ('ir_iqd','IQD/IRR-FM','Iraqi Dinar (Free Market)','دینار عراق (بازار آزاد)','iranianCurrency','تومان','IRR'),
            'price_afn': ('ir_afn','AFN/IRR-FM','Afghan Afghani (Free Market)','افغانی افغانستان (بازار آزاد)','iranianCurrency','تومان','IRR'),
            'gold_futures': ('gold_abshodeh','ABSHODEH','Melted Gold (spot)','آبشده نقدی','gold','مثقال','IRR'),
            'retail_sekee': ('coin_emami_retail','COIN-EMAMI-RETAIL','Emami Coin (retail)','سکه امامی (خرده‌فروشی)','coin','عدد','IRR'),
            'nim_blubber': ('coin_half_bubble','COIN-HALF-BUBBLE','Half Coin bubble','حباب نیم سکه','coin','تومان','IRR'),
            'rob_blubber': ('coin_quarter_bubble','COIN-QUARTER-BUBBLE','Quarter Coin bubble','حباب ربع سکه','coin','تومان','IRR'),
            'bourse': ('bourse_index','TEDPIX','Tehran Stock Exchange index','شاخص کل بورس','marketIndex','واحد','IDX'),
            'oil_brent': ('oil_brent','BRENT','Brent crude','نفت برنت','commodity','بشکه','USD'),
            'oil': ('oil_wti','WTI','WTI crude','نفت وست تگزاس','commodity','بشکه','USD'),
          }
          # Tehran wall-clock -> UTC (fixed +03:30, no DST since 2022).
          tehran = datetime.timezone(datetime.timedelta(hours=3, minutes=30))
          try:
              with open('/tmp/ir.json', encoding='utf-8') as fh:
                  ir = json.load(fh).get('current', {})
          except Exception as e:
              ir = {}
              print(f'tgju unavailable: {e}')
          for key, meta in ir_map.items():
              row = ir.get(key)
              if not isinstance(row, dict):
                  continue
              try:
                  raw = float(str(row.get('p', '')).replace(',', ''))
              except ValueError:
                  continue
              if raw <= 0:
                  continue
              aid, sym, name, name_fa, cat, unit, cur = meta
              div = 10.0 if cur == 'IRR' else 1.0
              sign = -1 if row.get('dt') == 'low' else 1
              try:
                  ts_ir = datetime.datetime.strptime(
                      row['ts'], '%Y-%m-%d %H:%M:%S'
                  ).replace(tzinfo=tehran).astimezone(
                      datetime.timezone.utc
                  ).strftime('%Y-%m-%dT%H:%M:%SZ')
              except (KeyError, TypeError, ValueError):
                  ts_ir = now
              quotes[aid] = {
                  'id': aid, 'symbol': sym, 'name': name, 'nameFa': name_fa,
                  'category': cat,
                  'price': round(raw / div, 2),
                  'changePercent': float(row.get('dp') or 0) * sign,
                  'unit': unit, 'currency': cur,
                  'timestamp': ts_ir, 'source': 'TGJU',
                  'status': 'LIVE', 'confidence': 1.0,
              }

          snap = {
              'timestamp': now,
              'source': 'github-actions-static-snapshot',
              'status': 'SNAPSHOT',
              'quotes': quotes,
          }
          p = pathlib.Path('data/latest.json')
          p.parent.mkdir(parents=True, exist_ok=True)
          p.write_text(
              json.dumps(snap, ensure_ascii=False, indent=2), encoding='utf-8'
          )
          print(f'wrote {len(quotes)} quotes')
          PY

      - name: Commit snapshot
        run: |
          git config user.name "molido-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/latest.json || true
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "chore(data): refresh static snapshot [skip ci]"
          git push
