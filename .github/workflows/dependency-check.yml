name: Dependency Check

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  outdated:
    # Pinned: ubuntu-latest moves to 26.04 from 2026-10-19. 24.04 is the
    # image every release so far was built and signed on; move deliberately
    # after a green run on ubuntu-26.04 (Flutter CI → Run workflow).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Report outdated packages
        run: flutter pub outdated
