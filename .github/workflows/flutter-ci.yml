name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual run, optionally on another runner image (e.g. to try 26.04
  # before switching) — never publishes anything.
  workflow_dispatch:
    inputs:
      runner:
        description: Runner image
        type: choice
        options: [ubuntu-24.04, ubuntu-26.04]
        default: ubuntu-24.04

jobs:
  analyze-test:
    # Pinned: ubuntu-latest moves to 26.04 from 2026-10-19. Stay on the
    # known-good image; a manual run can try 26.04 first.
    runs-on: ${{ inputs.runner || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Run tests
        run: flutter test --coverage

      # Analyze and test never touch Gradle, so a broken native dependency
      # would only surface at release time. Build it here instead.
      - name: Build APK (debug — native/Gradle gate)
        run: flutter build apk --debug

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/lcov.info
