name: Flutter CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      runner:
        description: Runner image
        type: choice
        options: [ubuntu-24.04, ubuntu-26.04]
        default: ubuntu-24.04

permissions:
  contents: write

jobs:
  analyze-test:
    runs-on: ${{ inputs.runner || 'ubuntu-24.04' }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Format and commit Dart sources
        if: github.event_name == 'pull_request'
        run: |
          dart format .
          git add -- '*.dart'
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: format Dart sources"
            git push origin "HEAD:${GITHUB_HEAD_REF}"
          fi

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Test snapshot freshness policy
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Run tests
        run: flutter test --coverage

      - name: Build APK (debug — native/Gradle gate)
        run: flutter build apk --debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: live-bazar-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: ignore
